    series: tk\s?(power|pmax)|(max\.?-?power|power)temperaturecoefficient(of)?(pmpp|pmax)?|^temperaturecoefficientof(p[m]?ax|p[u]?ax|p[a-z]ax)|(pm|pmax)\.?temp\.?coef\.?|power[\[\(]?(%\/K|gamma)[\]\)]?|power|pmax|γ|δ|pm
